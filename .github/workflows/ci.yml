name: Python CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  quality-assurance:
    name: Linting and Testing
    runs-on: ubuntu-latest

    # 3. Мультиверсійне тестування (Matrix Strategy)
    strategy:
      matrix:
        python-version: [ "3.10", "3.11", "3.12", "3.13" ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-html
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 2. Перевірка стилю коду (Linting)
      - name: Lint with Ruff
        run: ruff check .

      # 1. Автоматичне тестування з Pytest
      # 5. Автоматичний HTML-звіт (Генерація)
      - name: Test with pytest and generate HTML report
        run: |
          pytest --html=report.html --self-contained-html

      # 5. Автоматичний HTML-звіт (Збереження як артефакт)
      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-python-${{ matrix.python-version }}
          path: report.html

  docker-build:
    name: Docker Build
    needs: quality-assurance
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 4. Збірка Docker-контейнера
      - name: Build Docker image
        run: |
          docker build -t my-python-app:${{ github.sha }} .
          docker images # Перевірка, що образ створено